<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden='until-found' i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>Painel Planejamento Programa SOUL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap"
    />
    <style>
      /* Layout: editor de formulário à esquerda, prévia ao vivo da arte (2 páginas A4) à direita. */
      :root {
        --bg: #f3eee7;
        --panel: #fbf8f4;
        --line: #e3d8ca;
        --fg: #3a2a1f;
        --muted: #7c6757;
        --accent: #7b5233;
        --accent-fg: #fff;
        --gold: #c4925a;
        --field: #fff;
        --stage: #e9e2d8;
        --danger: #a5442e;
        --ok: #5f8a5b;
        --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        --sans: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #1d1814;
          --panel: #26201b;
          --line: #3d332b;
          --fg: #efe6dc;
          --muted: #b3a291;
          --accent: #c99a68;
          --accent-fg: #1d1814;
          --gold: #d4a46c;
          --field: #1f1a16;
          --stage: #141110;
          --danger: #e08a73;
          --ok: #8fbf89;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #1d1814;
        --panel: #26201b;
        --line: #3d332b;
        --fg: #efe6dc;
        --muted: #b3a291;
        --accent: #c99a68;
        --accent-fg: #1d1814;
        --gold: #d4a46c;
        --field: #1f1a16;
        --stage: #141110;
        --danger: #e08a73;
        --ok: #8fbf89;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
        font-size: 13.5px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      .app {
        display: grid;
        grid-template-columns: minmax(0, 430px) minmax(0, 1fr);
        height: 100%;
      }
      .ed {
        background: var(--panel);
        border-right: 1px solid var(--line);
        overflow-y: auto;
        min-width: 0;
      }
      .ed-head {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        padding: 16px 18px 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .modes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .mode {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      @media (max-width: 420px) {
        .modes {
          grid-template-columns: 1fr;
        }
      }
      .tv {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: #221a14;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        cursor: default;
      }
      .tv[hidden] {
        display: none;
      }
      .tv .tvstage {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        gap: 40px;
        transform-origin: 0 0;
        transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .tv .tvstage .pg {
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        transition: opacity 0.4s;
      }
      .tv .ctl {
        position: absolute;
        left: 50%;
        bottom: calc(22px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        padding: 6px;
        border-radius: 999px;
        background: rgba(20, 14, 10, 0.72);
        transition: opacity 0.4s;
        flex-wrap: wrap;
        justify-content: center;
        max-width: calc(100% - 32px);
      }
      .tv .ctl button {
        border: 0;
        background: transparent;
        color: #efe3d3;
        padding: 9px 16px;
        border-radius: 999px;
        cursor: pointer;
        font: 500 12.5px var(--sans);
        letter-spacing: 0.06em;
      }
      .tv .ctl button.on {
        background: #efe3d3;
        color: #2a1f17;
      }
      .tv .ctl button:hover:not(.on) {
        background: rgba(239, 227, 211, 0.14);
      }
      .tv.idle .ctl {
        opacity: 0;
      }
      .tv.idle {
        cursor: none;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand .sp {
        flex: 1;
      }
      .sync {
        font-size: 11.5px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 1em;
      }
      .sync:empty {
        display: none;
      }
      .sync::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        flex: none;
      }
      .sync[data-st='ok']::before {
        background: var(--ok);
      }
      .sync[data-st='saving']::before {
        background: var(--gold);
      }
      .sync[data-st='err']::before {
        background: var(--danger);
      }
      .lock[hidden],
      .app[hidden] {
        display: none !important;
      }
      .lock {
        position: fixed;
        inset: 0;
        z-index: 90;
        background: var(--bg);
        display: grid;
        place-items: center;
        padding: 24px 16px;
        overflow: auto;
      }
      .lock-card {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .lock-logo {
        align-self: center;
        background: #f7f2eb;
        border-radius: 16px;
        padding: 18px 28px;
        margin-bottom: 6px;
      }
      .lock-logo img {
        width: 150px;
        display: block;
      }
      .lock-card h1 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 30px;
        margin: 0;
        text-align: center;
        text-wrap: balance;
      }
      .lock-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
        text-align: center;
      }
      .lock-card .btn {
        justify-content: center;
        padding: 11px 14px;
      }
      .lock-err {
        color: var(--danger);
        font-size: 12.5px;
        min-height: 1.2em;
        text-align: center;
        line-height: 1.4;
      }
      .lock-err.ok {
        color: var(--muted);
      }
      .linkbtn {
        background: none;
        border: 0;
        color: var(--muted);
        text-decoration: underline;
        cursor: pointer;
        align-self: center;
        font-size: 12px;
        padding: 4px;
      }
      .lock-foot {
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        text-align: center;
        margin-top: 8px;
      }
      .brand b {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 24px;
        letter-spacing: 0.18em;
      }
      .brand span {
        font-size: 10.5px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--field);
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        font-weight: 500;
      }
      .btn:hover {
        border-color: var(--gold);
      }
      .btn.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      .btn.primary:hover {
        filter: brightness(1.08);
      }
      .btn.small {
        padding: 5px 9px;
        font-size: 11.5px;
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.danger {
        color: var(--danger);
      }
      .btn:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .btn[disabled] {
        opacity: 0.45;
        cursor: default;
      }
      .sec {
        border-bottom: 1px solid var(--line);
      }
      .sec > summary {
        list-style: none;
        cursor: pointer;
        padding: 15px 18px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sec > summary::-webkit-details-marker {
        display: none;
      }
      .sec > summary .t {
        font-family: var(--serif);
        font-size: 20px;
        font-weight: 600;
      }
      .sec > summary .s {
        font-size: 10.5px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
        margin-left: auto;
      }
      .sec > summary::before {
        content: '';
        width: 7px;
        height: 7px;
        border-right: 1.5px solid var(--muted);
        border-bottom: 1.5px solid var(--muted);
        transform: rotate(-45deg);
        transition: transform 0.15s;
      }
      .sec[open] > summary::before {
        transform: rotate(45deg);
      }
      .sec-body {
        padding: 2px 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .f {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
      }
      .f > label,
      .lbl {
        font-size: 10.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 500;
      }
      .f input[type='text'],
      .f input[type='password'],
      .f input[type='number'],
      .f textarea,
      .f select,
      .inp {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--field);
        border-radius: 7px;
        padding: 8px 10px;
      }
      textarea {
        resize: vertical;
        min-height: 38px;
        line-height: 1.45;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .row3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }
      .hint {
        font-size: 11.5px;
        color: var(--muted);
        line-height: 1.45;
      }
      .photo {
        display: grid;
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }
      .thumb {
        width: 88px;
        height: 88px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--stage) center/cover no-repeat;
        position: relative;
        overflow: hidden;
      }
      .thumb label {
        position: absolute;
        inset: 0;
        cursor: pointer;
      }
      .sliders {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .sl {
        display: grid;
        grid-template-columns: 72px 1fr;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .sl input {
        width: 100%;
        accent-color: var(--accent);
      }
      .file {
        display: none;
      }
      .card-ed {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--field);
        overflow: hidden;
      }
      .card-ed > summary {
        list-style: none;
        cursor: pointer;
        padding: 11px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .card-ed > summary::-webkit-details-marker {
        display: none;
      }
      .card-ed > summary .num {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-fg);
        display: grid;
        place-items: center;
        font-size: 11px;
      }
      .card-ed > summary .nm {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .card-ed .body {
        padding: 4px 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        border-top: 1px solid var(--line);
      }
      .it {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) 28px;
        gap: 8px;
        align-items: start;
      }
      .ins {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr);
        gap: 8px;
        align-items: start;
      }
      .iconbtn {
        width: 40px;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .iconbtn svg {
        width: 22px;
        height: 22px;
      }
      .x {
        width: 28px;
        height: 38px;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 18px;
        border-radius: 6px;
      }
      .x:hover {
        color: var(--danger);
      }
      .picker {
        grid-column: 1/-1;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      .picker button {
        height: 40px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .picker button:hover,
      .picker button.on {
        border-color: var(--gold);
        background: var(--field);
      }
      .picker svg {
        width: 22px;
        height: 22px;
      }
      .pay {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr) 28px;
        gap: 8px;
        align-items: center;
      }
      .calc {
        font-size: 12.5px;
        color: var(--muted);
      }
      .calc b {
        color: var(--fg);
        font-weight: 600;
      }
      .hint.off {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .hint.off::before {
        content: 'OFF';
        font-size: 9px;
        letter-spacing: 0.12em;
        font-weight: 600;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 4px;
      }
      .lib {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .lib-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--field);
      }
      .lib-item .n {
        flex: 1;
        min-width: 0;
      }
      .lib-item .n b {
        display: block;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lib-item .n small {
        color: var(--muted);
        font-size: 11px;
      }
      .empty {
        padding: 12px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .fname {
        font-size: 11.5px;
        color: var(--muted);
        word-break: break-word;
      }
      .fname b {
        color: var(--fg);
        font-weight: 500;
      }

      .pv {
        min-width: 0;
        overflow: auto;
        background: var(--stage);
        display: flex;
        flex-direction: column;
      }
      .pv-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 20px;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .pv-bar .sp {
        flex: 1;
      }
      .stagewrap {
        padding: 4px 20px 28px;
        flex: 1;
      }
      .stage {
        transform-origin: top left;
        display: flex;
        gap: 24px;
        width: max-content;
      }
      .stage.stack {
        flex-direction: column;
      }
      .stage .pg {
        box-shadow: 0 10px 36px rgba(40, 25, 10, 0.18);
      }
      .export-host {
        position: absolute;
        left: -20000px;
        top: 0;
        display: flex;
        gap: 0;
      }

      .toast {
        z-index: 80 !important;
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--fg);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 12.5px;
        z-index: 50;
        max-width: calc(100% - 32px);
      }
      .busy {
        position: fixed;
        inset: 0;
        background: rgba(20, 14, 10, 0.45);
        display: grid;
        place-items: center;
        z-index: 70;
      }
      .busy div {
        background: var(--panel);
        color: var(--fg);
        padding: 18px 24px;
        border-radius: 12px;
        font-family: var(--serif);
        font-size: 20px;
      }
      .confirm {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 12px;
      }

      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
          height: auto;
        }
        .ed {
          border-right: 0;
          overflow: visible;
        }
        .ed-head {
          position: static;
        }
        .pv {
          overflow: visible;
        }
        .stagewrap {
          padding-inline: 16px;
        }
      }
      @media (max-width: 480px) {
        .row3 {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* ======== ARTE (cores fixas: é o documento impresso) ======== */
      .pg {
        width: 794px;
        height: 1123px;
        position: relative;
        overflow: hidden;
        background: #f7f2eb;
        color: #3e2b1f;
        font-family: var(--sans);
        flex: none;
        -webkit-font-smoothing: antialiased;
      }
      .pg * {
        box-sizing: border-box;
      }
      .p1-photo {
        position: absolute;
        top: 0;
        right: 0;
        width: 61%;
        height: 100%;
      }
      .p1-photo img {
        width: 100%;
        height: 100%;
        display: block;
      }
      .p1-fade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          #f7f2eb 0%,
          #f7f2eb 37%,
          rgba(247, 242, 235, 0.88) 45%,
          rgba(247, 242, 235, 0.45) 55%,
          rgba(247, 242, 235, 0.08) 68%,
          rgba(247, 242, 235, 0) 76%
        );
      }
      .p1-fade2 {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(255, 247, 236, 0.28) 0%,
          rgba(255, 247, 236, 0) 30%,
          rgba(255, 247, 236, 0) 75%,
          rgba(247, 242, 235, 0.25) 100%
        );
      }
      .p1-arcs {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .p1-c {
        position: absolute;
        left: 68px;
        top: 42px;
        bottom: 48px;
        width: 560px;
        display: flex;
        flex-direction: column;
        --k: 1;
      }
      .logo {
        width: 290px;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-left: -10px;
      }
      .logo img {
        width: 290px;
        max-height: 260px;
        object-fit: contain;
        display: block;
      }
      .logo .mark {
        width: 212px;
        height: 72px;
        display: block;
      }
      .logo .cl {
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        margin-top: 14px;
      }
      .logo .cl i {
        flex: 1;
        height: 1px;
        background: #a98a6e;
        opacity: 0.7;
      }
      .logo .cl span {
        font-size: 14px;
        letter-spacing: 0.42em;
        font-weight: 500;
        color: #4a3324;
        padding-left: 0.42em;
      }
      .logo .soul {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 84px;
        letter-spacing: 0.17em;
        line-height: 0.95;
        color: #4a3324;
        padding-left: 0.17em;
        margin-top: 4px;
      }
      .logo .lot {
        display: flex;
        align-items: center;
        gap: 6px;

                  const d = r.result
                  d.createObjectStore('kv')

              if (!this.db) return res(null)
              try {
                const t = this.db.transaction(store, mode)
                const s = t.objectStore(store)
                const r = fn(s)
                t.oncomplete = () => res(r && r.result !== undefined ? r.result : true)
                t.onerror = () => res(null)
                t.onabort = () => res(null)
              } catch (e) {
                res(null)
              }

          return btoa(s)

          for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i)

          lastJson: null,
          status: 'off',
        }
        const hashCache = new Map(),
          photoCache = new Map()
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
        function withTimeout(p, ms) {
          return Promise.race([p, sleep(ms).then(() => null)])
        }
        async function cloudInit() {
          try {
            if (!(window.claude && window.claude.use)) return
            const r = await withTimeout(
              Promise.all([
                window.claude.use('db').catch(() => null),
                window.claude.use('user').catch(() => null),
              ]),
              9000,
            )
            if (!r || !r[0] || !r[1]) return
            const uid = await withTimeout(r[1].id(), 6000)
            if (!uid) return
            C.col = r[0].collection('data/users/' + uid)
          } catch (e) {
            C.col = null
          }
        }
        function cloudOk() {
          return !!C.col && !C.ro
        }
        function cloudErr(e) {
          const c = e && e.code
          if (
            c === 'invalid_argument' ||
            c === 'revoked' ||
            c === 'not_granted' ||
            c === 'capability_disabled' ||
            c === 'capability_removed'
          )
            C.ro = true
          setSync(C.ro ? 'off' : 'err')
        }
        function setSync(st) {
          C.status = st
          const el = $('#sync')
          if (!el) return
          el.dataset.st = st
          el.textContent =
            {

            }[st] || ''

        async function inBatches(n, fn) {
          for (let i = 0; i < n; i += 4)
            await Promise.all(Array.from({ length: Math.min(4, n - i) }, (_, j) => fn(i + j)))
        }
        async function cloudPut(name, str, key, kind) {
          const { iv, ct } = await encStr(key, str)
          const d = b64(ct)
          const ver = Date.now().toString(36) + Math.random().toString(36).slice(2, 6)
          const n = Math.max(1, Math.ceil(d.length / CH))
          await inBatches(n, (i) =>
            C.col.doc('c-' + name + '-' + ver + '-' + i).set({ d: d.slice(i * CH, (i + 1) * CH) }),
          )
          const mref = C.col.doc('m-' + name)
          const old = await mref.get()
          await mref.set({ kind, name, ver, n, iv: b64(iv), at: Date.now() })
          if (old.exists) {
            const o = old.data()
            await inBatches(o.n, (i) => C.col.doc('c-' + name + '-' + o.ver + '-' + i).delete())
          }
          return ver
        }
        async function cloudGet(name, key) {
          const m = await C.col.doc('m-' + name).get()
          if (!m.exists) return null
          const o = m.data()
          const parts = []
          await inBatches(o.n, async (i) => {
            parts[i] = await C.col.doc('c-' + name + '-' + o.ver + '-' + i).get()
          })
          if (parts.some((p) => !p || !p.exists)) throw { code: 'incomplete' }
          return {
            str: await decStr(key, {
              iv: unb64(o.iv),
              ct: unb64(parts.map((p) => p.data().d).join('')),
            }),
            ver: o.ver,
          }
        }
        async function cloudDel(name) {
          const r = C.col.doc('m-' + name)
          const m = await r.get()
          if (!m.exists) return
          const o = m.data()
          await r.delete()
          await inBatches(o.n, (i) => C.col.doc('c-' + name + '-' + o.ver + '-' + i).delete())
        }
        async function hashOf(str) {
          let h = hashCache.get(str)
          if (h) return h
          const d = await crypto.subtle.digest('SHA-256', TE.encode(str))
          h = [...new Uint8Array(d)]
            .slice(0, 16)
            .map((x) => x.toString(16).padStart(2, '0'))
            .join('')
          hashCache.set(str, h)
          photoCache.set(h, str)
          return h
        }
        /* fotos viram referências e são guardadas uma única vez cada */
        async function packState(data) {
          const photos = new Map()
          const c = JSON.parse(JSON.stringify(data))
          async function walk(o) {
            if (!o || typeof o !== 'object') return
            for (const k of Object.keys(o)) {
              const v = o[k]
              if (typeof v === 'string') {
                if (v.startsWith('data:image/') && v.length > 4000) {
                  const h = await hashOf(v)
                  photos.set(h, v)
                  o[k] = 'ref:' + h
                }
              } else await walk(v)
            }
          }
          await walk(c)
          return { json: JSON.stringify(c), photos }
        }
        async function unpackState(obj, key) {
          const need = new Set()
          ;(function scan(o) {
            if (!o || typeof o !== 'object') return
            for (const k in o) {
              const v = o[k]
              if (typeof v === 'string' && v.startsWith('ref:')) need.add(v.slice(4))
              else scan(v)
            }
          })(obj)
          const miss = [...need].filter((h) => !photoCache.has(h))
          await inBatches(miss.length, async (i) => {
            const h = miss[i]
            try {
              const r = await cloudGet('p-' + h, key)
              if (r) {
                photoCache.set(h, r.str)
                hashCache.set(r.str, h)
              }
            } catch (e) {}
          })
          ;(function fill(o) {
            if (!o || typeof o !== 'object') return
            for (const k in o) {
              const v = o[k]
              if (typeof v === 'string' && v.startsWith('ref:'))
                o[k] = photoCache.get(v.slice(4)) || ''
              else fill(v)
            }
          })(obj)
          return obj
        }
        let cT = null,
          cBusy = false,
          cAgain = false
        function cloudSchedule() {
          if (!cloudOk() || !V.key) return
          clearTimeout(cT)
          cT = setTimeout(() => {
            cT = null
            cloudSave()
          }, 2500)
        }
        async function cloudSave() {
          if (!cloudOk() || !V.key || !V.data) return
          if (cBusy) {
            cAgain = true
            return
          }
          cBusy = true
          C.dirty = false
          setSync('saving')
          const key = V.key
          try {
            const { json, photos } = await packState(V.data)
            const ex = await C.col.where('kind', '==', 'pm').get()
            const have = new Set(ex.docs.map((d) => String(d.data().name).slice(2)))
            for (const [h, v] of photos)
              if (!have.has(h)) {
                await cloudPut('p-' + h, v, key, 'pm')
                have.add(h)
              }
            if (json !== C.lastJson) {
              C.myVer = await cloudPut('state', json, key, 'sm')
              C.lastJson = json
            }
            for (const h of have) if (!photos.has(h)) await cloudDel('p-' + h)
            if (V.key === key) setSync('ok')
          } catch (e) {
            C.dirty = true
            cloudErr(e)
          } finally {
            cBusy = false
            if (cAgain) {
              cAgain = false
              cloudSchedule()
            }
          }
        }
        async function cloudFlush() {
          if (!cloudOk() || !V.data) return
          clearTimeout(cT)
          cT = null
          for (let i = 0; i < 40 && cBusy; i++) await sleep(250)
          if (C.dirty || C.lastJson == null) await cloudSave()
        }
        function cloudWatch() {
          if (!cloudOk() || C.unsub) return
          try {
            C.unsub = C.col.doc('m-state').onSnapshot(
              (sn) => {
                if (!sn.exists || !V.key) return
                const v = sn.data().ver
                if (v === C.myVer || v === C.loadedVer || C.dirty || cBusy || cT) return
                applyRemote()
              },
              () => {
                C.unsub = null
              },
            )
          } catch (e) {}
        }
        async function applyRemote() {
          const key = V.key
          try {
            const r = await cloudGet('state', key)
            if (!r || key !== V.key || C.dirty) return
            const obj = await unpackState(JSON.parse(r.str), key)
            if (key !== V.key || C.dirty) return
            C.loadedVer = r.ver
            C.lastJson = r.str

        /* ---------- imagens ---------- */
        const imgCache = new Map()
        function loadImg(src) {
          if (imgCache.has(src)) return imgCache.get(src)
          const p = new Promise((res, rej) => {
            const i = new Image()
            i.onload = () => res(i)
            i.onerror = rej
            i.src = src
          })
          imgCache.set(src, p)
          return p
        }
        const cropCache = new Map()
        async function crop(f, bw, bh, bg) {
          if (!f || !f.src) return ''
          const op = f.o == null ? 100 : +f.o
          const key = [f.src.length, f.src.slice(-40), f.x, f.y, f.z, op, bw, bh].join('|')
          if (cropCache.has(key)) return cropCache.get(key)
          let img
          try {
            img = await loadImg(f.src)
          } catch (e) {
            return ''
          }
          const w = img.naturalWidth,
            h = img.naturalHeight,
            A = bw / bh
          let cw, ch
          if (w / h > A) {
            ch = h
            cw = h * A
          } else {
            cw = w
            ch = w / A
          }
          const z = Math.max(1, +f.z || 1)
          cw /= z
          ch /= z
          const sx = (w - cw) * (+f.x / 100),
            sy = (h - ch) * (+f.y / 100)
          const outW = Math.round(Math.min(Math.max(cw, bw * 1.5), bw * 3)),
            outH = Math.round(outW / A)
          const c = document.createElement('canvas')
          c.width = outW
          c.height = outH
          const g = c.getContext('2d')
          g.imageSmoothingQuality = 'high'
          g.drawImage(img, sx, sy, cw, ch, 0, 0, outW, outH)
          if (op < 100) {
            g.globalAlpha = 1 - op / 100
            g.fillStyle = bg || '#f7f2eb'
            g.fillRect(0, 0, outW, outH)
            g.globalAlpha = 1
          }
          const url = c.toDataURL('image/jpeg', 0.9)
          if (cropCache.size > 60) cropCache.clear()
          cropCache.set(key, url)
          return url
        }
        function readPhoto(file, max) {
          return new Promise((res, rej) => {
            const r = new FileReader()
            r.onload = async () => {
              try {
                const i = await loadImg(r.result)
                const sc = Math.min(1, max / Math.max(i.naturalWidth, i.naturalHeight))
                const c = document.createElement('canvas')
                c.width = Math.round(i.naturalWidth * sc)
                c.height = Math.round(i.naturalHeight * sc)
                c.getContext('2d').drawImage(i, 0, 0, c.width, c.height)
                res(
                  file.type === 'image/png' && max < 1000
                    ? c.toDataURL('image/png')
                    : c.toDataURL('image/jpeg', 0.9),
                )
              } catch (e) {
                rej(e)
              }
            }
            r.onerror = rej
            r.readAsDataURL(file)
          })
        }

              const s = Math.sin(t),
                c = Math.cos(t),

                y = 36 + (1.18 * a * s * c) / den
              d += (k ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2)
            }
            return d + 'Z'
          }
          return (

            id +
            'a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b78347"/><stop offset=".45" stop-color="#e3c08c"/><stop offset=".7" stop-color="#c99a5c"/><stop offset="1" stop-color="#e8d2ad"/></linearGradient><radialGradient id="' +

            '<path d="' +

        /* ajusta o tamanho do texto quando o conteúdo não cabe na página */
        function fit(host) {
          let shrunk = false
          const c1 = host.querySelector('.p1-c')
          if (c1) {
            let k = 1
            c1.style.setProperty('--k', k)
            while (c1.scrollHeight > c1.clientHeight + 1 && k > 0.7) {
              k -= 0.03
              c1.style.setProperty('--k', k.toFixed(2))
              shrunk = true
            }
          }
          const cs = host.querySelector('.cards')
          if (cs) {
            const base = cs.classList.contains('n3') ? 0.86 : 1
            let k = base
            cs.style.setProperty('--k', k)
            /* investimento: lado a lado se couber; senão uma opção por linha; senão rótulo acima do valor */
            const tight = (iv) =>
              [...iv.querySelectorAll('.op,.op b,.op span')].some(
                (e) => e.scrollWidth > e.clientWidth + 1,
              )
            /* o mesmo formato em todos os cartões: se um precisar empilhar, todos empilham */
            const relayout = () => {
              const ivs = [...cs.querySelectorAll('.iv')]
              const set = (c) =>
                ivs.forEach((iv) => {
                  iv.classList.remove('stack', 'stack2')
                  if (c) iv.classList.add(c)
                })
              set('')
              if (ivs.some(tight)) {
                set('stack')
                if (ivs.some(tight)) set('stack2')
              }
            }
            const over = () =>
              [...cs.querySelectorAll('.cd')].some((d) => d.scrollHeight > d.clientHeight + 1) ||
              [...cs.querySelectorAll('.cd ul')].some((u) => u.scrollHeight > u.clientHeight + 1) ||
              [...cs.querySelectorAll('.st b,.st .l')].some(
                (e) => e.scrollWidth > e.clientWidth + 1,
              )
            /* nomes longos (ex.: PERSONALIZADO): reduz só os nomes, igual em todos os cartões, até caber na largura */
            const fitNames = () => {
              let nk = 1
              cs.style.setProperty('--nk', 1)
              const nms = [...cs.querySelectorAll('.cd .nm')]
              while (nms.some((e) => e.scrollWidth > e.clientWidth + 1) && nk > 0.5) {
                nk -= 0.04
                cs.style.setProperty('--nk', nk.toFixed(2))
              }
            }
            fitNames()
            relayout()
            while (over() && k > 0.6) {
              k -= 0.03
              cs.style.setProperty('--k', k.toFixed(2))
              fitNames()
              relayout()
              shrunk = true
            }
          }
          return shrunk
        }

            .replace(/[\\/:*?"<>|]+/g, '')
            .replace(/\s+-\s*$/, '')
        }
        function updateFname() {
          $('#fname').innerHTML = 'Arquivo: <b>' + esc(baseName()) + '.pdf</b>'
        }

        /* ---------- formulário ---------- */
        function getP(path) {
          return path.split('.').reduce((o, k) => (o == null ? o : o[k]), S)
        }
        function setP(path, v) {
          const ks = path.split('.')
          const last = ks.pop()
          const o = ks.reduce((o, k) => o[k], S)
          o[last] = v
        }
        const openState = {}
        function txt(path, label, opt) {
          opt = opt || {}
          const v = getP(path)
          const id = 'f_' + path.replace(/\./g, '_')
          const inp = opt.area
            ? '<textarea id="' +
              id +
              '" data-p="' +
              path +
              '" rows="' +
              (opt.rows || 2) +
              '">' +
              esc(v) +
              '</textarea>'
            : '<input type="' +
              (opt.type || 'text') +
              '" id="' +
              id +
              '" data-p="' +
              path +
              '" value="' +
              esc(v) +
              '"' +
              (opt.inputmode ? ' inputmode="' + opt.inputmode + '"' : '') +
              (opt.money ? ' data-money="1"' : '') +
              (opt.ph ? ' placeholder="' + esc(opt.ph) + '"' : '') +
              '>'
          return (
            '<div class="f">' +
            (label ? '<label for="' + id + '">' + label + '</label>' : '') +
            inp +
            (opt.hint ? '<div class="hint">' + opt.hint + '</div>' : '') +
            '</div>'
          )
        }
        function photoField(path, label) {
          const f = getP(path)
          const id = 'ph_' + path.replace(/\./g, '_')
          return (
            '<div class="f"><span class="lbl">' +
            label +
            '</span><div class="photo"><div class="thumb" style="background-image:url(\'' +
            (f.src || '') +
            '\')"><label for="' +
            id +
            '" title="Trocar foto"></label></div>' +
            '<div class="sliders"><input type="file" accept="image/*" id="' +
            id +
            '" class="file" data-photo="' +
            path +
            '"><label for="' +
            id +
            '" class="btn small" style="align-self:flex-start">' +
            (f.src ? 'Trocar foto' : 'Enviar foto') +
            '</label>' +
            '<div class="sl"><span>Horizontal</span><input type="range" min="0" max="100" value="' +
            f.x +
            '" data-p="' +
            path +
            '.x" data-num="1" aria-label="Posição horizontal"></div>' +
            '<div class="sl"><span>Vertical</span><input type="range" min="0" max="100" value="' +
            f.y +
            '" data-p="' +
            path +
            '.y" data-num="1" aria-label="Posição vertical"></div>' +
            '<div class="sl"><span>Zoom</span><input type="range" min="1" max="3" step="0.05" value="' +
            f.z +
            '" data-p="' +
            path +
            '.z" data-num="1" aria-label="Zoom"></div>' +
            '<div class="sl"><span>Intensidade</span><input type="range" min="15" max="100" step="1" value="' +
            (f.o == null ? 100 : f.o) +
            '" data-p="' +
            path +
            '.o" data-num="1" aria-label="Intensidade da foto"></div>' +
            '<div class="hint" style="display:flex;justify-content:space-between;padding-left:80px"><span>mais apagada</span><span>mais nítida</span></div></div></div></div>'
          )
        }
        function iconBtn(path) {
          const k = getP(path)
          return (
            '<button type="button" class="iconbtn" data-pick="' +
            path +
            '" title="Trocar ícone" aria-label="Trocar ícone">' +
            icon(k, 'currentColor', 1.4) +
            '</button>'
          )
        }
        function picker(path) {
          const k = getP(path)
          return (
            '<div class="picker" data-picker="' +
            path +
            '">' +
            ICON_KEYS.map(
              (x) =>
                '<button type="button" data-set-icon="' +
                x +
                '" class="' +
                (x === k ? 'on' : '') +
                '" title="' +
                esc(ICONS[x].n) +
                '" aria-label="' +
                esc(ICONS[x].n) +
                '">' +
                icon(x, 'currentColor', 1.4) +
                '</button>',
            ).join('') +
            '</div>'
          )
        }
        function sec(key, title, sub, body, open) {
          const o = openState[key] !== undefined ? openState[key] : open
          return (
            '<details class="sec" data-sec="' +
            key +
            '"' +
            (o ? ' open' : '') +
            '><summary><span class="t">' +
            title +
            '</span><span class="s">' +
            sub +
            '</span></summary><div class="sec-body">' +
            body +
            '</div></details>'
          )
        }
        let pickOpen = null

        function renderForm() {
          const c = S.capa,
            p = S.props
          let h = ''
          h += sec(
            'cli',
            'Cliente',
            'Arquivo',
            '<div class="row">' +
              txt('paciente', 'Paciente') +
              txt('mes', 'Referência', { hint: 'Ex.: Outubro de 2026' }) +
              '</div><div class="hint">Usado só no nome do arquivo. Não aparece na arte.</div>',
            true,
          )
          h += sec('mod', 'Modelos de programa', 'Biblioteca', modelosHTML(), false)
          // capa
          let ins = c.insights
            .map(
              (x, i) =>
                '<div class="ins">' +
                iconBtn('capa.insights.' + i + '.i') +
                txt('capa.insights.' + i + '.t', '', { area: 1, rows: 2 }) +
                (pickOpen === 'capa.insights.' + i + '.i' ? picker(pickOpen) : '') +
                '</div>',
            )
            .join('')
          h += sec(
            'capa',
            'Capa',
            'Página 1',
            photoField('capa.foto', 'Foto de fundo (foco do problema)') +
              '<div class="hint">A foto fica à direita e se funde ao fundo creme. Ajuste para enquadrar a região tratada.</div>' +
              txt('capa.programa', 'Nome do programa') +
              txt('capa.titulo', 'Título', {
                area: 1,
                rows: 2,
                hint: 'Quebre a linha onde quiser.',
              }) +
              txt('capa.descricao', 'O que é o programa', { area: 1, rows: 3 }) +
              '<div class="f"><span class="lbl">Insights (até 4)</span>' +
              ins +
              '</div>' +
              '<div class="row">' +
              txt('capa.duracao', 'Duração (semanas)', { inputmode: 'numeric' }) +
              txt('capa.eyebrow', 'Rótulo acima do título') +
              '</div>' +
              txt('capa.tagline', 'Frase da marca', { area: 1, rows: 2 }),
            true,
          )
          // propostas
          let cards = p.lista
            .map((cd, ci) => {
              const base = 'props.lista.' + ci
              const key = 'card' + ci
              const o = openState[key] !== undefined ? openState[key] : ci === 0
              const its = cd.itens
                .map(
                  (x, ii) =>
                    '<div class="it">' +
                    iconBtn(base + '.itens.' + ii + '.i') +
                    txt(base + '.itens.' + ii + '.t', '', { area: 1, rows: 2 }) +
                    '<button type="button" class="x" data-del-item="' +
                    ci +
                    '.' +
                    ii +
                    '" aria-label="Remover item">×</button>' +
                    (pickOpen === base + '.itens.' + ii + '.i' ? picker(pickOpen) : '') +
                    '</div>',
                )
                .join('')
              const pays = cd.parcelas
                .map((o, pi) => {
                  const id = 'sel_' + ci + '_' + pi
                  return (
                    '<div class="pay"><select class="inp" id="' +
                    id +
                    '" data-p="' +
                    base +
                    '.parcelas.' +
                    pi +
                    '.n" data-num="1" aria-label="Quantidade de parcelas">' +
                    (+o.n < 2 ? '<option value="1" selected disabled>Escolha</option>' : '') +
                    Array.from({ length: 11 }, (_, k) => k + 2)
                      .map(
                        (k) =>
                          '<option value="' +
                          k +
                          '"' +
                          (+o.n === k ? ' selected' : '') +
                          '>' +
                          k +
                          'x</option>',
                      )
                      .join('') +
                    '</select><div class="calc" data-calc="' +
                    ci +
                    '.' +
                    pi +
                    '">' +
                    calcTxt(cd, o) +
                    '</div><button type="button" class="x" data-del-pay="' +
                    ci +
                    '.' +
                    pi +
                    '" aria-label="Remover opção">×</button></div>'
                  )
                })
                .join('')
              return (
                '<details class="card-ed" data-sec="' +
                key +
                '"' +
                (o ? ' open' : '') +
                '><summary><span class="num">' +
                (ci + 1) +
                '</span><span class="nm">' +
                esc(cd.nome.replace(/\n/g, ' ')) +
                '</span></summary><div class="body">' +
                photoField(base + '.foto', 'Foto da proposta') +
                txt(base + '.nome', 'Nome do plano', { area: 1, rows: 2 }) +
                txt(base + '.tag', 'Subtítulo', { area: 1, rows: 2 }) +
                '<div class="f"><span class="lbl">O que contempla</span>' +
                its +
                (cd.itens.length < 7
                  ? '<button type="button" class="btn small" data-add-item="' +
                    ci +
                    '" style="align-self:flex-start">+ Adicionar item</button>'
                  : '') +
                '</div>' +
                '<div class="row">' +
                txt(base + '.duracao', 'Duração (semanas)', { inputmode: 'numeric' }) +
                txt(base + '.atend', 'Atendimentos', { inputmode: 'numeric' }) +
                '</div>' +
                '<div class="f"><span class="lbl">Investimento</span>' +
                txt(base + '.total', '', {
                  inputmode: 'decimal',
                  money: 1,
                  ph: 'Valor total (R$)',
                }) +
                '<div class="hint off">Valor total · uso interno, não aparece na proposta</div>' +
                '<span class="lbl" style="margin-top:6px">Opções de parcelamento</span>' +
                pays +
                (cd.parcelas.length < 3
                  ? '<button type="button" class="btn small" data-add-pay="' +
                    ci +
                    '" style="align-self:flex-start">+ Opção de pagamento</button>'
                  : '') +
                '<div class="hint">O valor de cada parcela é calculado sobre o valor total.</div></div>' +
                '<div class="actions">' +
                (ci > 0
                  ? '<button type="button" class="btn small" data-move="' +
                    ci +
                    '.-1">← Mover</button>'
                  : '') +
                (ci < p.lista.length - 1
                  ? '<button type="button" class="btn small" data-move="' +
                    ci +
                    '.1">Mover →</button>'
                  : '') +
                '<button type="button" class="btn small" data-dup="' +
                ci +
                '"' +
                (p.lista.length >= 3 ? ' disabled' : '') +
                '>Duplicar</button>' +
                (p.lista.length > 1
                  ? '<button type="button" class="btn small danger" data-del-card="' +
                    ci +
                    '">Remover</button>'
                  : '') +
                '</div>' +
                '</div></details>'
              )
            })
            .join('')
          h += sec(
            'props',
            'Propostas',
            'Página 2',
            txt('props.titulo', 'Título') +
              txt('props.programa', 'Nome do programa') +
              txt('props.intro', 'Texto de abertura', { area: 1, rows: 3 }) +
              cards +
              (p.lista.length < 3
                ? '<button type="button" class="btn" data-add-card="1" style="align-self:flex-start">+ Adicionar proposta</button>'
                : '<div class="hint">Máximo de 3 propostas por página.</div>'),
            true,
          )
          h += sec(
            'marca',
            'Identidade',
            'Logo e rodapé',
            '<div class="f"><span class="lbl">Logo</span><div class="hint">A proposta usa a logo oficial da Clínica SOUL. Para usar outra versão, envie um PNG com fundo transparente.</div><div class="actions"><input type="file" accept="image/*" id="logoFile" class="file"><label for="logoFile" class="btn small">Enviar logo</label>' +
              (S.logo
                ? '<button type="button" class="btn small danger" data-clear-logo="1">Voltar à logo oficial</button>'
                : '') +
              '</div></div>' +
              '<div class="row">' +
              txt('props.cab', 'Cabeçalho pág. 2') +
              txt('props.pagina', 'Nº da página') +
              '</div>' +
              txt('props.rodape', 'Frase do rodapé'),
            false,
          )
          h += sec(
            'seg',
            'Segurança',
            'Acesso',
            '<div class="hint">Conectado como <b>' +
              esc(V.user) +
              '</b>. ' +
              (cloudOk()
                ? 'Propostas e modelos ficam criptografados com a sua senha e sincronizados entre os seus aparelhos.'
                : 'Propostas e modelos ficam criptografados com a sua senha neste aparelho.') +
              '</div>' +
              '<div class="f"><label for="lockMin">Bloquear após inatividade</label><select id="lockMin" class="inp">' +
              [5, 15, 30, 60]
                .map(
                  (m) =>
                    '<option value="' +
                    m +
                    '"' +
                    (((V.data && V.data.lockMin) || 15) === m ? ' selected' : '') +
                    '>' +
                    m +
                    ' minutos</option>',
                )
                .join('') +
              '</select></div>' +
              '<span class="lbl" style="margin-top:6px">Trocar usuário ou senha</span>' +
              '<div class="f"><label for="pwUser">Usuário</label><input type="text" id="pwUser" value="' +
              esc(V.user) +
              '" autocomplete="username"></div>' +
              '<div class="f"><label for="pwCur">Senha atual</label><input type="password" id="pwCur" autocomplete="current-password"></div>' +
              '<div class="row"><div class="f"><label for="pwNew">Nova senha</label><input type="password" id="pwNew" autocomplete="new-password"></div><div class="f"><label for="pwNew2">Confirmar</label><input type="password" id="pwNew2" autocomplete="new-password"></div></div>' +
              '<div class="hint">Deixe a nova senha em branco para trocar só o usuário.</div>' +
              '<div class="lock-err" id="pwMsg" role="status" style="text-align:left"></div>' +
              '<button type="button" class="btn small" data-chpw="1" style="align-self:flex-start">Salvar alterações</button>',
            false,
          )
          h +=
            '<div style="padding:18px" class="hint">Tudo o que você preenche é salvo automaticamente e criptografado.</div>'
          $('#form').innerHTML = h
        }
        function calcTxt(cd, o) {
          if ((parseInt(o.n, 10) || 1) < 2) return 'Escolha o número de parcelas'
          const v = parcVal(cd.total, o.n)
          return v
            ? (+o.n === 1 ? 'À vista ' : o.n + 'x de ') + '<b>R$ ' + v + '</b>'
            : 'Informe o valor total'
        }
        function refreshCalc(ci) {
          const cd = S.props.lista[ci]
          document.querySelectorAll('[data-calc^="' + ci + '."]').forEach((el) => {
            const pi = +el.dataset.calc.split('.')[1]
            el.innerHTML = calcTxt(cd, cd.parcelas[pi])
          })
        }
        function modelosHTML() {
          const list = modelos.length
            ? '<div class="lib">' +
              modelos
                .map(
                  (m) =>
                    '<div class="lib-item"><div class="n"><b>' +
                    esc(m.nome) +
                    '</b><small>' +
                    esc(new Date(m.at).toLocaleDateString('pt-BR')) +
                    ' · ' +
                    m.state.props.lista.length +
                    ' proposta(s)</small></div>' +
                    (delAsk === m.id
                      ? '<span class="confirm">Excluir?<button type="button" class="btn small danger" data-del-mod-ok="' +
                        m.id +
                        '">Sim</button><button type="button" class="btn small" data-del-mod-no="1">Não</button></span>'
                      : '<button type="button" class="btn small" data-load="' +
                        m.id +
                        '">Usar</button><button type="button" class="x" data-del-mod="' +
                        m.id +
                        '" aria-label="Excluir modelo">×</button>') +
                    '</div>',
                )
                .join('') +
              '</div>'
            : '<div class="empty">Nenhum modelo salvo ainda. Monte um programa (ex.: SOUL REHAB Ombro) e clique em <b>Salvar como modelo</b>. Na próxima proposta, é só escolher o modelo e trocar o nome do paciente.</div>'
          return (
            list +
            '<div class="actions"><button type="button" class="btn small" data-new="1">Começar do exemplo</button><button type="button" class="btn small" data-export="1">Exportar backup</button><label for="importFile" class="btn small">Importar backup</label></div><div class="hint">O arquivo de backup não tem senha. Guarde-o em local seguro.</div>'
          )
        }
        let delAsk = null

        /* eventos do formulário */
        const form = $('#form')
        form.addEventListener('input', (e) => {
          const t = e.target,
            p = t.dataset.p
          if (!p) return
          let v = t.value
          if (t.dataset.num) v = parseFloat(v)
          setP(p, v)
          const mc = p.match(/^props\.lista\.(\d+)\.(total|parcelas)/)
          if (mc) refreshCalc(+mc[1])
          if (/^props\.lista\.\d+\.nome$/.test(p)) {
            const s = t.closest('.card-ed')
            if (s) s.querySelector('.nm').textContent = v.replace(/\n/g, ' ')
          }
          schedule()
        })
        form.addEventListener('change', async (e) => {
          const t = e.target
          if (t.dataset.money) {
            const n = moneyParse(t.value)
            if (n != null) {
              t.value = money(n)
              setP(t.dataset.p, t.value)
              const mc = t.dataset.p.match(/^props\.lista\.(\d+)/)
              if (mc) refreshCalc(+mc[1])
              schedule()
            }
          }
          if (t.dataset.photo) {
            const f = t.files[0]
            if (!f) return
            try {
              const src = await readPhoto(f, 2400)
              const o = getP(t.dataset.photo)
              o.src = src
              o.x = 50
              o.y = 50
              o.z = 1
              o.o = 100
              renderForm()
              schedule()
            } catch (err) {
              toast('Não consegui abrir essa imagem. Tente um JPG ou PNG.')
            }
          }
          if (t.id === 'lockMin' && V.data) {
            V.data.lockMin = +t.value
            C.dirty = true
            saveVault()
            cloudSchedule()
            toast('Bloqueio após ' + t.value + ' minutos sem uso')
            return
          }
          if (t.id === 'logoFile') {
            const f = t.files[0]
            if (!f) return
            try {
              S.logo = await readPhoto(f, 900)
              renderForm()
              schedule()
            } catch (err) {
              toast('Não consegui abrir essa imagem.')
            }
          }
        })
        form.addEventListener(
          'toggle',
          (e) => {
            const d = e.target
            if (d.dataset && d.dataset.sec) openState[d.dataset.sec] = d.open
          },
          true,
        )
        form.addEventListener('click', async (e) => {
          const b = e.target.closest('button')
          if (!b) return
          const d = b.dataset
          const L = S.props.lista
          if (d.pick) {
            pickOpen = pickOpen === d.pick ? null : d.pick
            renderForm()
            return
          }
          if (d.setIcon) {
            const path = b.closest('[data-picker]').dataset.picker
            setP(path, d.setIcon)
            pickOpen = null
            renderForm()
            schedule()
            return
          }
          if (d.addItem) {
            L[+d.addItem].itens.push({ i: 'pessoa', t: '' })
            renderForm()
            schedule()
            return
          }
          if (d.delItem) {
            const [a, i] = d.delItem.split('.').map(Number)
            L[a].itens.splice(i, 1)
            pickOpen = null
            renderForm()
            schedule()
            return
          }
          if (d.addPay) {
            const c = L[+d.addPay]
            c.parcelas.push({
              n: c.parcelas.length
                ? Math.max(2, Math.min(12, +c.parcelas[c.parcelas.length - 1].n + 2))
                : 4,
            })
            renderForm()
            schedule()
            return
          }
          if (d.delPay) {
            const [a, i] = d.delPay.split('.').map(Number)
            L[a].parcelas.splice(i, 1)
            renderForm()
            schedule()
            return
          }
          if (d.addCard) {
            L.push(blankCard())
            openState['card' + (L.length - 1)] = true
            renderForm()
            schedule()
            return
          }
          if (d.dup) {
            const ci = +d.dup
            L.splice(ci + 1, 0, clone(L[ci]))
            renderForm()
            schedule()
            return
          }
          if (d.delCard) {
            L.splice(+d.delCard, 1)
            renderForm()
            schedule()
            return
          }
          if (d.move) {
            const [a, dir] = d.move.split('.').map(Number)
            const t = L[a]
            L[a] = L[a + dir]
            L[a + dir] = t
            renderForm()
            schedule()
            return
          }
          if (d.clearLogo) {
            S.logo = ''
            renderForm()
            schedule()
            return
          }
          if (d.load) {
            const m = modelos.find((x) => x.id === d.load)
            if (!m) return
            const pac = S.paciente,
              mes = S.mes
            S = migrate(clone(m.state))
            S.paciente = pac
            S.mes = mes
            pickOpen = null
            renderForm()
            schedule()
            toast('Modelo “' + m.nome + '” carregado')
            return
          }
          if (d.delMod) {
            delAsk = d.delMod
            renderForm()
            return
          }
          if (d.delModNo) {
            delAsk = null
            renderForm()
            return
          }
          if (d.delModOk) {
            await DB.del(d.delModOk)
            delAsk = null
            await loadModelos()
            renderForm()
            toast('Modelo excluído')
            return
          }
          if (d.new) {
            const pac = S.paciente,
              mes = S.mes
            S = defaultState()
            S.paciente = pac
            S.mes = mes
            renderForm()
            schedule()
            toast('Exemplo SOUL REHAB carregado')
            return
          }
          if (d.chpw) {
            const m = $('#pwMsg')
            m.className = 'lock-err'
            m.textContent = ''
            const err = await changePw(
              $('#pwUser').value,
              $('#pwCur').value,
              $('#pwNew').value,
              $('#pwNew2').value,
            )
            if (err) {
              m.textContent = err
              return
            }
            openState.seg = true
            renderForm()
            toast('Acesso atualizado')
            return
          }
          if (d.export) {
            await saveFile(
              'Modelos SOUL - backup.json',
              new Blob([JSON.stringify({ app: 'soul-propostas', v: 1, modelos }, null, 0)], {
                type: 'application/json',
              }),
            )
            return
          }
        })
        $('#importFile').addEventListener('change', async (e) => {
          const f = e.target.files[0]
          if (!f) return
          try {
            const j = JSON.parse(await f.text())
            const arr = j.modelos || []
            let n = 0
            for (const m of arr) {
              if (m && m.id && m.state) {
                await DB.put(m)
                n++
              }
            }
            await loadModelos()
            renderForm()

          if (TV.view === 'all') {
            const sw = pw * 2 + gap
            s = Math.min((W * (1 - 2 * m)) / sw, (H * (1 - 2 * m)) / ph)

            y = (H - ph * s) / 2

            const i = +TV.view

            x = (W - pw * s) / 2 - i * (pw + gap) * s

        async function getAuth() {
          let cloud = null
          const local = await DB.get('auth')
          if (cloudOk()) {
            try {
              const sn = await C.col.doc('auth').get()
              if (sn.exists) cloud = sn.data()

        async function readLocal(local, pw, raw, acct) {
          /* tenta abrir dados salvos neste aparelho */
          try {
            const lv = await DB.get('vault')
            if (!lv || !local) return null
            if (local.v === 2) {
              const lk = await importDEK(local.acct === acct ? raw : await unwrapAuth(local, pw))
              return { data: JSON.parse(await decStr(lk, lv)), same: local.acct === acct }
            }
            const kek = await deriveKey(pw, local.salt, local.iter)
            if ((await decStr(kek, local.check)) !== 'soul-ok') return null
            return { data: JSON.parse(await decStr(kek, lv)), same: false }
          } catch (e) {
            return null
          }
        }
        async function doSetup(u, p, p2) {
          if (!u.trim()) return 'Informe um usuário.'
          if (p.length < 8) return 'A senha precisa ter pelo menos 8 caracteres.'
          if (p !== p2) return 'As senhas não conferem.'
          const { cloud } = await getAuth()
          if (cloud) {
            showLock('login', { t: 'Já existe um acesso na sua conta. Entre com ele.', ok: 1 })
            return null
          }
          const raw = rnd(32)
          const auth = await makeAuth(u.trim(), p, raw)
          const draft = await DB.get('rascunho')
          const mods = (await DB.legacyList()) || []
          const local = {
            data: { draft: draft && draft.capa ? draft : null, modelos: mods, lockMin: 15 },
            same: false,
          }
          await DB.set('fails', { n: 0, until: 0 })
          await openVault(await importDEK(raw), auth, local, true)
          await DB.delk('rascunho')
          await DB.tx('modelos', 'readwrite', (st) => st.clear())
          return null
        }
        async function doLogin(u, p) {
          const f = (await DB.get('fails')) || { n: 0, until: 0 }
          if (Date.now() < f.until)
            return (
              'Muitas tentativas. Aguarde ' + fmtWait(f.until - Date.now()) + ' e tente de novo.'
            )
          const { cloud, local } = await getAuth()
          const a = cloud || local
          if (!a) {
            showLock('setup')
            return null
          }
          let raw = null,
            auth = a
          try {
            if (a.v === 2) raw = await unwrapAuth(a, p)
            else {
              const kek = await deriveKey(p, a.salt, a.iter)
              if ((await decStr(kek, a.check)) !== 'soul-ok') throw 0
              raw = rnd(32)
              auth = await makeAuth(a.user, p, raw)
            }
          } catch (e) {
            raw = null
          }
          if (!raw || norm(u) !== norm(a.user)) {
            f.n++
            let m = 'Usuário ou senha incorretos.'
            if (f.n >= 5) {
              f.until = Date.now() + Math.min(900000, 30000 * Math.pow(2, f.n - 5))
              m += ' Acesso pausado por ' + fmtWait(f.until - Date.now()) + '.'
            } else if (f.n >= 3) m += ' Restam ' + (5 - f.n) + ' tentativa(s) antes de uma pausa.'
            await DB.set('fails', f)
            return m
          }
          await DB.set('fails', { n: 0, until: 0 })
          const loc = await readLocal(local, p, raw, auth.acct)
          await openVault(await importDEK(raw), auth, loc, !cloud)
          return null
        }
        async function openVault(key, auth, local, pushAuth) {
          V.key = key
          V.auth = auth
          V.user = auth.user
          C.dirty = false
          C.lastJson = null
          C.myVer = null
          C.loadedVer = null
          let data = null,
            fromCloud = false
          if (cloudOk()) {
            setSync('saving')
            try {
              if (pushAuth) await C.col.doc('auth').set(auth)
              const r = await cloudGet('state', key)
              if (r) {
                data = await unpackState(JSON.parse(r.str), key)
                C.loadedVer = r.ver
                C.lastJson = r.str
                fromCloud = true
              }
            } catch (e) {
              cloudErr(e)
            }
          }
          if (!fromCloud) {
            data = local ? local.data : null
            if (cloudOk()) C.dirty = true
          } else if (local && !local.same && local.data && Array.isArray(local.data.modelos)) {
            /* junta modelos de um acesso antigo deste aparelho */
            const ids = new Set((data.modelos || []).map((m) => m.id))
            let n = 0
            for (const m of local.data.modelos)
              if (m && m.id && !ids.has(m.id)) {
                ;(data.modelos = data.modelos || []).push(m)
                n++
              }
            if (n) C.dirty = true
          }
          V.data = normData(data)
          await DB.set('auth', auth)
          await saveVault()
          S = V.data.draft && V.data.draft.capa ? migrate(V.data.draft) : defaultState()
          await loadModelos()
          lastAct = Date.now()
          $('#lock').hidden = true
          $('#lockCard').innerHTML = ''
          $('.app').hidden = false
          renderForm()
          updateFname()
          render()
          if (cloudOk()) {
            if (C.status !== 'err') setSync('ok')
            if (C.dirty) cloudSave()
            cloudWatch()
          } else setSync('off')
        }

            lockNow({ t: 'Bloqueado por inatividade. Entre novamente.', ok: 1 })
        }
        setInterval(idleCheck, 15000)
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            if (V.key && cloudOk() && (C.dirty || cT)) {
              flushSave().then(cloudFlush)
            }
          } else idleCheck()
        })
        $('#bLock').addEventListener('click', () => lockNow({ t: 'Ferramenta bloqueada.', ok: 1 }))

        /* ---------- início ---------- */
        ;(async function init() {
          if (!(window.crypto && crypto.subtle && window.indexedDB)) {
            showLock('nodb')
            return
          }
          if (!(await DB.open())) {
            showLock('nodb')
            return
          }
          showLock('wait')
          await cloudInit()
          const { cloud, local } = await getAuth()
          showLock(cloud || local ? 'login' : 'setup')
        })()
      })()
    </script>
  </body>
</html>
