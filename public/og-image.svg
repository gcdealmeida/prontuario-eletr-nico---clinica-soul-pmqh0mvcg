<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F3" />
      <stop offset="50%" stop-color="#FAF4EA" />
      <stop offset="100%" stop-color="#F2E8D8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6527" />
      <stop offset="25%" stop-color="#AF8349" />
      <stop offset="50%" stop-color="#DFBF8E" />
      <stop offset="75%" stop-color="#AF8349" />
      <stop offset="100%" stop-color="#8C6527" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6527" />
      <stop offset="50%" stop-color="#AF8349" />
      <stop offset="100%" stop-color="#73574A" />
    </linearGradient>
    <linearGradient id="rose" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E5A894" />
      <stop offset="50%" stop-color="#B87355" />
      <stop offset="100%" stop-color="#5E2C1A" />
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A46A" stop-opacity="0" />
      <stop offset="25%" stop-color="#C9A46A" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#DFBF8E" />
      <stop offset="75%" stop-color="#C9A46A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C9A46A" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF5EE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F2E8D8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#5C4033" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <ellipse cx="600" cy="315" rx="550" ry="290" fill="url(#glow)" />

  <!-- Borders -->
  <rect x="28" y="28" width="1144" height="574" rx="28" stroke="url(#gold)" stroke-width="2" fill="none" opacity="0.6" />
  <rect x="36" y="36" width="1128" height="558" rx="20" stroke="#DFBF8E" stroke-width="1" fill="none" opacity="0.3" />
  <rect x="0" y="0" width="1200" height="10" fill="url(#gold)" />

  <!-- Left Side: Official Brand Identity Card -->
  <g transform="translate(110, 115)">
    <!-- White Card Background with Soft Shadow -->
    <rect x="0" y="0" width="400" height="400" rx="36" fill="#FFFFFF" stroke="#E9E1D2" stroke-width="2" filter="url(#shadow)" />
    <rect x="14" y="14" width="372" height="372" rx="24" fill="none" stroke="#FAF5EE" stroke-width="2" />

    <!-- 3 Interlocking Circles Symbol -->
    <g transform="translate(200, 140)">
      <g fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="-65" cy="0" r="46" />
        <circle cx="65" cy="0" r="46" />
        <circle cx="0" cy="0" r="46" />
      </g>
      <circle cx="0" cy="0" r="18" fill="url(#rose)" />
      <circle cx="-2" cy="-2" r="5" fill="#FFFFFF" opacity="0.45" />
    </g>

    <!-- Brand Typography Vertical Stack -->
    <g transform="translate(200, 248)">
      <!-- CLÍNICA with Side Rules -->
      <line x1="-120" y1="-8" x2="-65" y2="-8" stroke="#C9A46A" stroke-width="1.2" />
      <text x="0" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#73574A" text-anchor="middle" letter-spacing="6">CLÍNICA</text>
      <line x1="65" y1="-8" x2="120" y2="-8" stroke="#C9A46A" stroke-width="1.2" />

      <!-- SOUL Big serif -->
      <text x="0" y="42" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#33221C" text-anchor="middle" letter-spacing="8">SOUL</text>

      <!-- Lotus Icon in Center -->
      <g transform="translate(-16, 52) scale(1)">
        <line x1="-80" y1="10" x2="-8" y2="10" stroke="#C9A46A" stroke-width="1" />
        <path d="M 16 3 C 13.5 8 13.5 14 16 17 C 18.5 14 18.5 8 16 3 Z" fill="#FFF9F0" stroke="#C9A46A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 16 17 C 12 16 8 13 9 8 C 11.5 8 14.5 12 16 17 Z" stroke="#C9A46A" stroke-width="1.2" fill="none" stroke-linecap="round" />
        <path d="M 16 17 C 20 16 24 13 23 8 C 20.5 8 17.5 12 16 17 Z" stroke="#C9A46A" stroke-width="1.2" fill="none" stroke-linecap="round" />
        <line x1="40" y1="10" x2="112" y2="10" stroke="#C9A46A" stroke-width="1" />
      </g>

      <!-- SAÚDE E BEM-ESTAR -->
      <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#73574A" text-anchor="middle" letter-spacing="4.5">SAÚDE E BEM-ESTAR</text>
    </g>
  </g>

  <!-- Right Side: Content & Actions -->
  <g transform="translate(560, 135)">
    <!-- Badge -->
    <rect x="0" y="0" width="235" height="36" rx="18" fill="#FAF5EE" stroke="#E3C89A" stroke-width="1.5" />
    <text x="117" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#8C6527" text-anchor="middle" letter-spacing="1.5">ATENDIMENTO CLÍNICO</text>

    <!-- Main Heading -->
    <text x="0" y="105" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#33221C" letter-spacing="0.5">
      Pré-Cadastro
    </text>
    <text x="0" y="165" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="50" font-weight="600" fill="#8C6527" letter-spacing="1">
      Clínica SOUL
    </text>

    <!-- Gold Accent Line -->
    <rect x="0" y="195" width="480" height="2" fill="url(#line)" />

    <!-- Subtitle & Information -->
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#5C4033">
      Saúde, Bem-Estar e Fisioterapia Integrada
    </text>
    <text x="0" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#73574A">
      Preencha seus dados cadastrais e histórico de saúde com rapidez.
    </text>
    <text x="0" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#73574A">
      Suas respostas agilizam a preparação da sua primeira consulta!
    </text>

    <!-- Highlights -->
    <g transform="translate(0, 345)">
      <!-- Highlight 1 -->
      <g>
        <circle cx="12" cy="12" r="12" fill="#FAF5EE" stroke="#C9A46A" stroke-width="1.5" />
        <path d="M7 12 L10.5 15.5 L17 8.5" stroke="#8C6527" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="34" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#5C4033">
          100% Seguro &amp; Sigiloso
        </text>
      </g>
      <!-- Highlight 2 -->
      <g transform="translate(235, 0)">
        <circle cx="12" cy="12" r="12" fill="#FAF5EE" stroke="#C9A46A" stroke-width="1.5" />
        <path d="M7 12 L10.5 15.5 L17 8.5" stroke="#8C6527" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="34" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#5C4033">
          Leva apenas 2 minutos
        </text>
      </g>
    </g>
  </g>
</svg>
