<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bgSoul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F3" />
      <stop offset="50%" stop-color="#FAF4EA" />
      <stop offset="100%" stop-color="#F2E8D8" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6527" />
      <stop offset="25%" stop-color="#AF8349" />
      <stop offset="50%" stop-color="#DFBF8E" />
      <stop offset="75%" stop-color="#AF8349" />
      <stop offset="100%" stop-color="#8C6527" />
    </linearGradient>
    <linearGradient id="roseGradient" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E5A894" />
      <stop offset="50%" stop-color="#B87355" />
      <stop offset="100%" stop-color="#5E2C1A" />
    </linearGradient>
  </defs>

  <!-- Fundo suave institucional -->
  <rect width="600" height="600" fill="url(#bgSoul)" />

  <!-- Borda interna fina em dourado -->
  <rect x="20" y="20" width="560" height="560" rx="32" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6" />

  <!-- Símbolo Oficial dos 3 anéis entrelaçados da Clínica SOUL -->
  <g transform="translate(300, 205)">
    <g fill="none" stroke="url(#goldGradient)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-85" cy="0" r="60" />
      <circle cx="85" cy="0" r="60" />
      <circle cx="0" cy="0" r="60" />
    </g>
    <!-- Centro da flor / gota na cor terracota / rose -->
    <circle cx="0" cy="0" r="24" fill="url(#roseGradient)" />
    <circle cx="-3" cy="-3" r="7" fill="#FFFFFF" opacity="0.45" />
  </g>

  <!-- Tipografia Oficial da Clínica SOUL -->
  <g transform="translate(300, 360)">
    <!-- Linhas laterais e palavra CLÍNICA -->
    <line x1="-180" y1="-12" x2="-95" y2="-12" stroke="#C9A46A" stroke-width="1.8" />
    <text x="0" y="-5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#73574A" text-anchor="middle" letter-spacing="9">CLÍNICA</text>
    <line x1="95" y1="-12" x2="180" y2="-12" stroke="#C9A46A" stroke-width="1.8" />

    <!-- Nome SOUL em caixa alta serifada -->
    <text x="0" y="68" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#33221C" text-anchor="middle" letter-spacing="12">SOUL</text>

    <!-- Flor de Lótus entre linhas douradas -->
    <g transform="translate(-24, 86)">
      <line x1="-120" y1="15" x2="-12" y2="15" stroke="#C9A46A" stroke-width="1.5" />
      <g transform="translate(0, 0)">
        <path d="M 24 4 C 20 12 20 21 24 26 C 28 21 28 12 24 4 Z" fill="#FFF9F0" stroke="#C9A46A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 24 26 C 18 24 12 20 13 12 C 17 12 21 18 24 26 Z" stroke="#C9A46A" stroke-width="1.8" fill="none" stroke-linecap="round" />
        <path d="M 24 26 C 30 24 36 20 35 12 C 31 12 27 18 24 26 Z" stroke="#C9A46A" stroke-width="1.8" fill="none" stroke-linecap="round" />
      </g>
      <line x1="60" y1="15" x2="168" y2="15" stroke="#C9A46A" stroke-width="1.5" />
    </g>

    <!-- Slogan SAÚDE E BEM-ESTAR -->
    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#73574A" text-anchor="middle" letter-spacing="7">SAÚDE E BEM-ESTAR</text>
  </g>
</svg>
